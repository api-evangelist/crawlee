description: >-
  Crawlee is distributed as a library, not as a client for a hosted API. Every package
  below is published by the Crawlee maintainers (Apify) from the apify/crawlee and
  apify/crawlee-python monorepos, and every one of them IS the product rather than an
  SDK wrapping a remote service. Versions and publish dates were read from the public
  registry metadata endpoints on 2026-09-07.
note: >-
  The JavaScript monorepo publishes ~20 packages that all share a single lockstep version
  (lerna fixed-mode), so the full @crawlee/* set is represented here by the umbrella
  package plus the crawler-implementation and infrastructure packages a consumer actually
  installs. Two release lines are live: 3.18.x on the `latest` dist-tag and a 4.0.0
  release-candidate line on the `rc` dist-tag (see lifecycle/crawlee-lifecycle.yml).
