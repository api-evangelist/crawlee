description: >-
  Crawlee publishes no rate limits, returns no rate-limit headers, and has no 429 to
  return, because it answers no requests. It is a library running inside the consumer's own
  process. An honest zero, not a documentation gap.
headers: {}
responseCodes: {}
limits: []
note: >-
  SUPERSEDES A FABRICATED ARTIFACT. Until this pass, this file declared five invented
  limits — 10 req/min and 1,000/month on a "free tier", 100 req/min and 100,000/month on a
  "professional tier", 1,000 req/min on an "enterprise contract" — plus a full
  X-RateLimit-* header set and a 429 exhaustion code, all written by the 2026-05-04 bulk
  sweep and self-declared as "scaffold values". Crawlee serves no HTTP traffic, so none of
  those headers has anywhere to appear. The scaffold has been removed.
throttling_crawlee_applies_outbound:
  note: >-
    Crawlee sits on the OTHER side of rate limiting — it is the client being limited, and
    it publishes real, documented mechanisms for behaving well. These are recorded for
    completeness and are NOT limits imposed on a consumer of a Crawlee API.
  mechanisms:
    - name: robots.txt crawl-delay
      detail: >-
        RobotsTxtFile.get_crawl_delay() reads and honours the crawl-delay directive
        published by the target site.
      source: https://crawlee.dev/python/api/class/RobotsTxtFile
    - name: AutoscaledPool
      detail: >-
        Concurrency is scaled against local CPU and memory headroom rather than a fixed
        ceiling, bounded by max_used_cpu_ratio and max_used_memory_ratio (out-of-range
        values have been rejected since Crawlee for Python 1.8.2).
      source: https://crawlee.dev/python/docs/guides/scaling-crawlers
    - name: max_session_rotations
      detail: >-
        "Maximum number of session rotations per request. The crawler rotates the session
        if a proxy error occurs or if the website blocks the request."
      source: https://crawlee.dev/python/api/class/BasicCrawlerOptions
